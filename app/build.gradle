plugins { id 'com.android.application' }

android {
    namespace 'com.reconstruir.app'
    compileSdk 33

    defaultConfig {
        applicationId 'com.reconstruir.installtest'
        minSdk 21
        targetSdk 33
        versionCode 18
        versionName '0.18.0'
    }

    buildTypes {
        debug { minifyEnabled false }
        release { minifyEnabled false }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
