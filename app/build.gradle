plugins { id 'com.android.application' }

android {
    namespace 'com.reconstruir.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.reconstruir.app.beta'
        minSdk 23
        targetSdk 34
        versionCode 14
        versionName '0.14.0'
    }

    buildTypes {
        debug { applicationIdSuffix '.debug' }
        release { minifyEnabled false }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
