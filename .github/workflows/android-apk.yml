name: Build Reconstruir APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'
          cache-provider: basic

      - name: Generate long-lived test keystore
        run: |
          keytool -genkeypair -v             -keystore reconstruir-test.jks             -storepass changeit             -keypass changeit             -alias reconstruir             -keyalg RSA             -keysize 2048             -validity 7300             -startdate "01/01/2020 00:00:00"             -dname "CN=Reconstruir Test, O=Reconstruir, C=BR"

      - name: Build signed release APK
        run: |
          gradle --no-daemon assembleRelease             -Pandroid.injected.signing.store.file="$GITHUB_WORKSPACE/reconstruir-test.jks"             -Pandroid.injected.signing.store.password=changeit             -Pandroid.injected.signing.key.alias=reconstruir             -Pandroid.injected.signing.key.password=changeit

      - name: Verify APK exists
        run: test -s app/build/outputs/apk/release/app-release.apk

      - name: Verify APK signature
        run: jarsigner -verify -verbose app/build/outputs/apk/release/app-release.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: reconstruir-android-v17
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
